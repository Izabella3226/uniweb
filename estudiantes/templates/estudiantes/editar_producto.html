<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>Editar Producto</title>
</head>
<body>

    <h1>Editar Producto</h1>

    <form method="POST">
        {% csrf_token %}

        <input type="text" name="nombre" value="{{ producto.nombre }}">

        <input type="number" name="precio" value="{{ producto.precio }}">

        <button type="submit">
            Guardar cambios
        </button>
    </form>

</body>
</html>
